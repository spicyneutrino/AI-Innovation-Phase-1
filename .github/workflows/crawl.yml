name: SoS Regulatory Crawler

on:
  schedule:
    - cron: '0 3 * * *'          # Daily at 3 AM UTC
  workflow_dispatch:
    inputs:
      mode:
        description: Crawl mode (full or designated)
        required: false
        default: full

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Run crawler
        run: uv run sos-crawler crawl --mode "${{ github.event.inputs.mode || 'full' }}" --run-qa --run-enrichment --max-retries 2

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: crawl-output-${{ github.run_number }}
          path: |
            var/sos_crawler/
          retention-days: 90

