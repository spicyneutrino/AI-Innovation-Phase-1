[project]
name = "ms-regulations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=3.4 ; python_full_version < '3.10'",
    "boto3>=1.34",
    "botocore>=1.34",
    "cssselect>=1.2",
    "dotenv>=0.9.9",
    "lxml>=5.1",
    "pandas>=2.3.3",
    "pdfplumber>=0.10",
    "playwright>=1.43",
    "pypdf>=4.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.34",
    "streamlit>=1.56.0",
    "tiktoken>=0.12.0",
    "tldextract>=5.1",
    "twisted>=24.3",
]

[project.scripts]
sos-crawler = "sos_crawler.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sos_crawler = ["config_data/*.yaml"]
